[project]
name = "satusehat-integration"
version = "4.11.0"
description = "Unofficial SATUSEHAT FHIR R4 SDK for Python — 112 PayloadBuilder classes covering all FHIR R4 resources for SATUSEHAT integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ivan William Harsono", email = "ivanwilliam.md@gmail.com"}
]
keywords = ["fhir", "hl7", "satusehat", "healthcare", "ehr", "fhir-r4", "indonesia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/ivanwilliammd/satusehat-integration-python"
Repository = "https://github.com/ivanwilliammd/satusehat-integration-python"
Issues = "https://github.com/ivanwilliammd/satusehat-integration-python/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
